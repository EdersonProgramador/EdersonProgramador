<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Relativo ao Vite base (/agencia/admin/). Paths /absolutos são reescritos como /agencia/admin/absolutos. -->
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <link rel="manifest" href="./manifest.json" />
    <title>Agência Ederson Programador</title>
    <script src="./env-config.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('embed') === '1') return;
        if (!('serviceWorker' in navigator)) return;
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/agencia/admin/sw.js').catch(function () {});
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
