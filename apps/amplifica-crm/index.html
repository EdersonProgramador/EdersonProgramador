<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Amplifica CRM</title>
    <script src="https://meet.jit.si/external_api.js"></script>
    <!-- Not rewritten by Vite — keep public prefix for Agency proxy -->
    <script src="/amplifica-crm/env-config.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('embed') === '1') return;
        if (!('serviceWorker' in navigator)) return;
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/amplifica-crm/sw.js').catch(function () {});
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite base=/amplifica-crm/ rewrites this to /amplifica-crm/src/main.tsx -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
