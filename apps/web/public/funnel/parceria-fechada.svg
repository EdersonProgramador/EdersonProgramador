<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Parceria fechada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07140f"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#22c55e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6b89a"/>
      <stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- ambient lines -->
  <g opacity="0.12" stroke="#22c55e" stroke-width="1.5">
    <path d="M120 760 H1480"/>
    <path d="M180 790 H1420"/>
  </g>

  <!-- desk / contract surface -->
  <rect x="420" y="520" width="760" height="220" rx="18" fill="url(#desk)" stroke="#22c55e" stroke-opacity="0.25"/>
  <rect x="470" y="560" width="320" height="140" rx="8" fill="#111318" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="500" y="590" width="220" height="10" rx="4" fill="#22c55e" fill-opacity="0.55"/>
  <rect x="500" y="620" width="260" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="500" y="645" width="180" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="740" cy="680" r="18" fill="#22c55e" fill-opacity="0.9"/>
  <path d="M732 680 l6 6 12-14" fill="none" stroke="#04140c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- handshake silhouette -->
  <g transform="translate(800 430)" filter="url(#soft)" opacity="0.35">
    <ellipse cx="0" cy="40" rx="160" ry="50" fill="#22c55e"/>
  </g>
  <g transform="translate(800 430)">
    <!-- left arm/hand -->
    <path d="M-210 30c40-55 95-80 150-70 35 6 62 28 78 55-28 18-58 28-92 30-48 2-90-4-136-15z" fill="url(#hand)"/>
    <!-- right arm/hand -->
    <path d="M210 30c-40-55-95-80-150-70-35 6-62 28-78 55 28 18 58 28 92 30 48 2 90-4 136-15z" fill="url(#hand)"/>
    <!-- clasp -->
    <ellipse cx="0" cy="28" rx="54" ry="28" fill="#b88962"/>
    <path d="M-40 20c18 16 40 24 62 24s44-8 62-24" fill="none" stroke="#7a5234" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- seal badge -->
  <g transform="translate(1180 250)">
    <circle r="72" fill="#0c1a12" stroke="#22c55e" stroke-width="3"/>
    <circle r="58" fill="none" stroke="#22c55e" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
    <text x="0" y="-6" text-anchor="middle" fill="#4ade80" font-family="Georgia, serif" font-size="13" letter-spacing="2">PARCERIA</text>
    <text x="0" y="18" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="18" font-weight="700">FECHADA</text>
  </g>
</svg>
